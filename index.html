<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Birthday Cake 🎂</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
    rel="stylesheet"
  />

  <style>
    #mainTitle {
      font-size: 32px;
      font-family: 'Pixelify Sans', sans-serif;
      margin-bottom: 8px;
    }

    #subTitle {
      font-size: 18px;
      font-family: 'Pixelify Sans', sans-serif;
      color: #555;
    }

    #micButton {
      font-family: 'Pixelify Sans', sans-serif;
      font-size: 16px;
      padding: 10px 18px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="birthdayText"></div>

    <div class="cake-container">
      <div class="cake" id="cake"></div>
    </div>
  </div>

  <script>
    // Read URL params
    const params = new URLSearchParams(window.location.search);

    const name = params.get("name") || "Alzahraa";

    let candleCount = parseInt(params.get("candles")) || 4;
    candleCount = Math.min(Math.max(candleCount, 1), 30);

    const birthdayText = document.getElementById("birthdayText");

    birthdayText.innerHTML = `
      <div id="mainTitle">Happy Birthday, ${name}!</div>
      <div id="subTitle">Make a wish and blow candles.</div>
    `;

    const cake = document.getElementById("cake");

    const colors = [
      "green-candle",
      "purple-candle",
      "blue-candle",
      "yellow-candle"
    ];

    const CAKE_VISUAL_WIDTH = 35;

    function createCandles(count) {
      cake.innerHTML = "";

      const CANDLE_VISUAL_WIDTH = 2;
      const availableWidth = CAKE_VISUAL_WIDTH;
      const candlesPerRow = 6;
      const shiftAmount = 4;

      for (let i = 0; i < count; i++) {
        const candle = document.createElement("div");

        candle.classList.add("candle");

        const colorClass =
          colors[Math.floor(Math.random() * colors.length)];

        candle.classList.add(colorClass);

        const row = Math.floor(i / candlesPerRow);
        const col = i % candlesPerRow;

        const totalCandlesInRow = Math.min(
          candlesPerRow,
          count - row * candlesPerRow
        );

        const rowSpacing =
          availableWidth / (totalCandlesInRow + 1);

        const leftBase =
          rowSpacing * (col + 1) -
          CANDLE_VISUAL_WIDTH / 2 +
          5;

        const rowShift =
          row % 2 === 0 ? 0 : shiftAmount;

        candle.style.position = "absolute";
        candle.style.top = `${10 + row * 3}px`;
        candle.style.left = `${leftBase - rowShift + 4}px`;

        cake.appendChild(candle);
      }
    }

    createCandles(candleCount);


    // ==========================================
    // MICROPHONE / BLOW DETECTION
    // ==========================================

    let blown = false;

    async function startMicDetection() {

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;

        const audioContext =
          new AudioContext();

        const source =
          audioContext.createMediaStreamSource(stream);

        const analyser =
          audioContext.createAnalyser();

        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.7;

        source.connect(analyser);

        const dataArray =
          new Uint8Array(analyser.fftSize);

        document.getElementById("subTitle").textContent =
          "Blow on the candles! 💨";

        micButton.textContent =
          "🎙️ Listening... Blow! 💨";


        function detectBlow() {

          if (blown) return;

          analyser.getByteTimeDomainData(dataArray);

          let sum = 0;

          for (let i = 0; i < dataArray.length; i++) {

            const value =
              (dataArray[i] - 128) / 128;

            sum += value * value;
          }

          const volume =
            Math.sqrt(
              sum / dataArray.length
            );


          // Sensitivity of the microphone
          if (volume > 0.05) {

            blown = true;

            blowOutCandles();

            return;
          }

          requestAnimationFrame(detectBlow);
        }

        detectBlow();

      } catch (error) {

        console.error(
          "Microphone error:",
          error
        );

        document.getElementById("subTitle").textContent =
          "Please allow microphone access 🎙️";

        micButton.disabled = false;

        micButton.textContent =
          "🎙️ Allow Microphone";
      }
    }


    // ==========================================
    // MICROPHONE BUTTON
    // ==========================================

    const micButton =
      document.createElement("button");

    micButton.id = "micButton";

    micButton.textContent =
      "🎙️ Start Microphone";

    document
      .getElementById("birthdayText")
      .appendChild(micButton);


    micButton.addEventListener(
      "click",
      async () => {

        micButton.disabled = true;

        micButton.textContent =
          "🎙️ Starting...";

        await startMicDetection();

      }
    );


    // ==========================================
    // BLOW OUT CANDLES
    // ==========================================

    function blowOutCandles() {

      const candles =
        document.querySelectorAll(".candle");

      candles.forEach((candle) => {

        const delay =
          Math.random() * 1000;

        setTimeout(() => {

          candle.classList.add("blown");

        }, delay);

      });


      setTimeout(() => {

        const subTitle =
          document.getElementById("subTitle");

        subTitle.textContent =
          "Yayy! Wishing you the happiest birthday ever!! 🎉💙";

        micButton.textContent =
          "✨ Wish made! ✨";

      }, 1200);
    }

  </script>

</body>
</html>
